name: Playwright Tests

on:
  # Автозапуск каждый день в 07:20 UTC
  schedule:
    - cron: '20 7 * * *'

  # Ручной запуск из интерфейса GitHub
  workflow_dispatch:
    inputs:
      run_extra:
        description: 'Дополнительные параметры (опционально)'
        required: false
        default: ''
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Получение кода из ветки PWTESTS
      - uses: actions/checkout@v4
        with:
          ref: 'PSLPWproject'  # Ваша ветка с тестами

      # Шаг 2: Установка Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Шаг 3: Установка зависимостей
      - name: Install dependencies
        run: npm ci

      # Шаг 4: Установка Playwright
      - name: Install Playwright
        run: npx playwright install --with-deps

      # Шаг 5: Запуск тестов
      - name: Run Playwright tests
        run: npx playwright test --workers 4 --headless
        env:
          CI: true

      # Шаг 6: Загрузка результатов (артефактов)
      - uses: actions/upload-artifact@v3
        if: always()  # Загружаем даже если тесты упали
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
